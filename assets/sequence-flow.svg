<svg xmlns="http://www.w3.org/2000/svg" width="720" height="932" viewBox="0 0 720 932" role="img" aria-labelledby="title desc">
  <title id="title">Governed Agent Plane sequence</title>
  <desc id="desc">A vertical sequence of six interactions designed for phone and desktop readability.</desc>
  <style>.bg{fill:#f8fafc}.title{font:700 30px system-ui,sans-serif;fill:#0f172a}.subtitle{font:400 18px system-ui,sans-serif;fill:#475569}.timeline{stroke:#94a3b8;stroke-width:3}.connector{stroke:#0369a1;stroke-width:3}.step{fill:#0369a1}.stepText{font:700 20px system-ui,sans-serif;fill:#ffffff}.event{fill:#ffffff;stroke:#94a3b8;stroke-width:2}.actor{font:600 19px system-ui,sans-serif;fill:#0369a1}.message{font:600 22px system-ui,sans-serif;fill:#0f172a}</style>
  <rect class="bg" width="100%" height="100%" rx="24"/>
  <text x="360" y="50" text-anchor="middle" class="title">Governed Agent Plane</text>
  <text x="360" y="82" text-anchor="middle" class="subtitle">Interaction sequence</text>
  <line x1="62" y1="174.5" x2="62" y2="829.5" class="timeline"/>
  <circle cx="62" cy="174.5" r="18" class="step"/><text x="62" y="181.5" text-anchor="middle" class="stepText">1</text><line x1="80" y1="174.5" x2="108" y2="174.5" class="connector"/><rect x="108" y="122" width="532" height="105" rx="18" class="event"/><text x="136" y="158" class="actor">Client → Control plane</text><text x="136" y="196" class="message">Submit typed task</text>
<circle cx="62" cy="305.5" r="18" class="step"/><text x="62" y="312.5" text-anchor="middle" class="stepText">2</text><line x1="80" y1="305.5" x2="108" y2="305.5" class="connector"/><rect x="108" y="253" width="532" height="105" rx="18" class="event"/><text x="136" y="289" class="actor">Control plane internal step</text><text x="136" y="327" class="message">Build immutable preview</text>
<circle cx="62" cy="436.5" r="18" class="step"/><text x="62" y="443.5" text-anchor="middle" class="stepText">3</text><line x1="80" y1="436.5" x2="108" y2="436.5" class="connector"/><rect x="108" y="384" width="532" height="105" rx="18" class="event"/><text x="136" y="420" class="actor">Control plane → Reviewer</text><text x="136" y="458" class="message">Request exact-action approval</text>
<circle cx="62" cy="567.5" r="18" class="step"/><text x="62" y="574.5" text-anchor="middle" class="stepText">4</text><line x1="80" y1="567.5" x2="108" y2="567.5" class="connector"/><rect x="108" y="515" width="532" height="105" rx="18" class="event"/><text x="136" y="551" class="actor">Reviewer → Control plane</text><text x="136" y="589" class="message">Approve or reject</text>
<circle cx="62" cy="698.5" r="18" class="step"/><text x="62" y="705.5" text-anchor="middle" class="stepText">5</text><line x1="80" y1="698.5" x2="108" y2="698.5" class="connector"/><rect x="108" y="646" width="532" height="105" rx="18" class="event"/><text x="136" y="682" class="actor">Control plane → Executor</text><text x="136" y="720" class="message">Send approved payload</text>
<circle cx="62" cy="829.5" r="18" class="step"/><text x="62" y="836.5" text-anchor="middle" class="stepText">6</text><line x1="80" y1="829.5" x2="108" y2="829.5" class="connector"/><rect x="108" y="777" width="532" height="105" rx="18" class="event"/><text x="136" y="813" class="actor">Executor → Client</text><text x="136" y="851" class="message">Return result and evidence</text>
</svg>
