[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "governed-agent-plane"
version = "0.1.0"
description = "A governed control plane for coordinating AI agents, approvals, state, and verifiable execution."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mahsan07" }]
dependencies = []

[project.scripts]
governed-agent-plane = "governed_agent_plane.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
